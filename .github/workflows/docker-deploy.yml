name: Deploy Docker Images to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/package.json'
      - 'backend/package.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.modified, 'frontend/package.json') ||
      contains(github.event.head_commit.added, 'frontend/package.json')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: package-version
        run: |
          VERSION=$(jq -r '.version' frontend/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Frontend version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/budget-tracker-frontend
          tags: |
            type=raw,value=${{ steps.package-version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Budget Tracker Frontend
            org.opencontainers.image.description=Frontend application for Budget Tracker
            org.opencontainers.image.version=${{ steps.package-version.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        run: |
          echo "Package published at: ghcr.io/${{ github.repository_owner }}/budget-tracker-frontend:${{ steps.package-version.outputs.version }}"
          echo "To make the package public, go to: https://github.com/${{ github.repository_owner }}?tab=packages"
          echo "Find 'budget-tracker-frontend' and change visibility to Public in package settings"

  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.modified, 'backend/package.json') ||
      contains(github.event.head_commit.added, 'backend/package.json')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: package-version
        run: |
          VERSION=$(jq -r '.version' backend/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Backend version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/budget-tracker-backend
          tags: |
            type=raw,value=${{ steps.package-version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Budget Tracker Backend
            org.opencontainers.image.description=Backend API for Budget Tracker
            org.opencontainers.image.version=${{ steps.package-version.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        run: |
          echo "Package published at: ghcr.io/${{ github.repository_owner }}/budget-tracker-backend:${{ steps.package-version.outputs.version }}"
          echo "To make the package public, go to: https://github.com/${{ github.repository_owner }}?tab=packages"
          echo "Find 'budget-tracker-backend' and change visibility to Public in package settings"
