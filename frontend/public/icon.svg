<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.3)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  <!-- Subtle shine -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#shine)"/>
  <!-- Wallet body -->
  <rect x="96" y="160" width="320" height="220" rx="24" ry="24" fill="white" opacity="0.95"/>
  <!-- Wallet flap -->
  <path d="M96 200 Q96 160 136 160 L376 132 Q416 128 416 168 L416 200 Z" fill="white" opacity="0.85"/>
  <!-- Wallet clasp/card slot -->
  <rect x="300" y="240" width="116" height="72" rx="16" ry="16" fill="#4338ca" opacity="0.15"/>
  <!-- Coin circle -->
  <circle cx="358" cy="276" r="28" fill="#6366f1" opacity="0.9"/>
  <!-- Dollar sign on coin -->
  <text x="358" y="290" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="white" text-anchor="middle">$</text>
  <!-- Horizontal lines on wallet (card slots) -->
  <rect x="128" y="210" width="140" height="8" rx="4" fill="#6366f1" opacity="0.2"/>
  <rect x="128" y="240" width="120" height="8" rx="4" fill="#6366f1" opacity="0.15"/>
  <rect x="128" y="270" width="100" height="8" rx="4" fill="#6366f1" opacity="0.1"/>
</svg>
